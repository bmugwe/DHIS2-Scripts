<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sync Started</title>
    <style>
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f9fafb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            text-align: center;
        }
        h3 {
            color: #16a34a;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #374151;
            margin: 6px 0;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        a:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
<div class="card">
    <h3>✅ Data Submission Started</h3>
    <p><strong>Program:</strong> {{ program }}</p>
    <p><strong>Month:</strong> {{ month }}</p>
    <p><strong>Facilities:</strong> {{ facilities | join(', ') }}</p>
    <p>Summary aggregation is complete and data is being pushed to DHIS2 in the background.</p>
    <a href="/">← Back to Dashboard</a>
</div>
</body>
</html>
